name: वेबसाइट और APK बनाएँ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Capacitor Android प्रोजेक्ट
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: ऐप आइकन
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              p=android/app/src/main/res/mipmap-$d/$f.png
              [ -f "$p" ] && cp site/icons/icon-192.png "$p"
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: APK बनाएँ
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../township-hisab.apk
      - name: रिलीज़ में डालें
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest township-hisab.apk --title "टाउनशिप हिसाब APK" --notes "फ़ोन में इंस्टॉल करने के लिए township-hisab.apk डाउनलोड करें।"
