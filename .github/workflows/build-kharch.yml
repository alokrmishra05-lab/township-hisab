name: खर्च रजिस्टर APK बनाएँ

on:
  push:
    branches: [app/kharch-register]

permissions:
  contents: write

concurrency:
  group: build-kharch
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor Android प्रोजेक्ट
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: कैमरा अनुमति (रसीद की फ़ोटो सीधे कैमरा से)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n 'CAMERA\|hardware.camera' $M
      - name: ऐप आइकन
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              p=android/app/src/main/res/mipmap-$d/$f.png
              [ -f "$p" ] && cp site/icons/icon-192.png "$p"
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
      - name: APK बनाएँ (पक्की चाबी से हस्ताक्षर, ताकि नया APK पुराने के ऊपर install हो)
        env:
          KS_B64: ${{ secrets.KHARCH_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KHARCH_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "KHARCH_KEYSTORE_B64 / KHARCH_KEYSTORE_PASS secret नहीं मिले — रुक रहे हैं"; exit 1; fi
          KS_PASS=$(printf %s "$KS_PASS" | tr -d " \r\n\t"); export KS_PASS
          echo "पासवर्ड की लंबाई: ${#KS_PASS} (अपेक्षित 32)"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          printf %s "$KS_B64" | tr -d " \r\n\t" | base64 -d > "$RUNNER_TEMP/kharch.p12" || { echo "KHARCH_KEYSTORE_B64 अधूरा/गलत कॉपी हुआ (लंबाई: $(printf %s "$KS_B64" | tr -d " \r\n\t" | wc -c), अपेक्षित लगभग 6000+)"; exit 1; }
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/kharch.p12" --ks-type PKCS12 --ks-key-alias kharch \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../surya-kunj-kharch.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs ../surya-kunj-kharch.apk | grep -i "SHA-256" | head -1
          rm -f "$RUNNER_TEMP/kharch.p12"
      - name: रिलीज़ में डालें
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kharch-latest --yes --cleanup-tag || true
          gh release create kharch-latest surya-kunj-kharch.apk --target app/kharch-register --title "सूर्य कुंज खर्च रजिस्टर APK" --notes "खर्च रजिस्टर (https://surya-kunj-staging.pages.dev/expenses) का ऐप। फ़ोन में इंस्टॉल करने के लिए surya-kunj-kharch.apk डाउनलोड करें।"
